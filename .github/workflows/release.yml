name: Multiplatform Release (.apk, .exe, .dmg, .ipa)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── 1. Android Build (.apk) ─────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Decode Optional Android Release Keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 --decode > android/app/release-keystore.jks
            echo "MAILFLOW_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/release-keystore.jks" >> "$GITHUB_ENV"
          fi

      - name: Build Android APK
        env:
          MAILFLOW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MAILFLOW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MAILFLOW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if ! echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then VER="1.0.2"; fi
          BUILD_NUM=$((10 + GITHUB_RUN_NUMBER))
          flutter build apk --release --build-name="$VER" --build-number="$BUILD_NUM" \
            --dart-define="SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            --dart-define="SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define="BACKEND_API_URL=${{ secrets.BACKEND_API_URL }}" \
            --dart-define="BACKEND_API_SECRET=${{ secrets.BACKEND_API_SECRET }}" \
            --dart-define="GOOGLE_OAUTH_WEB_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}" \
            || (sleep 15 && flutter build apk --release --build-name="$VER" --build-number="$BUILD_NUM" \
            --dart-define="SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            --dart-define="SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define="BACKEND_API_URL=${{ secrets.BACKEND_API_URL }}" \
            --dart-define="BACKEND_API_SECRET=${{ secrets.BACKEND_API_SECRET }}" \
            --dart-define="GOOGLE_OAUTH_WEB_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}") \
            || (sleep 30 && flutter build apk --release --build-name="$VER" --build-number="$BUILD_NUM" \
            --dart-define="SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            --dart-define="SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define="BACKEND_API_URL=${{ secrets.BACKEND_API_URL }}" \
            --dart-define="BACKEND_API_SECRET=${{ secrets.BACKEND_API_SECRET }}" \
            --dart-define="GOOGLE_OAUTH_WEB_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}")

      - name: Prepare APK Asset
        run: cp build/app/outputs/flutter-apk/app-release.apk MailFlow-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifact
          path: MailFlow-Android.apk

  # ── 2. Windows Build (.exe) ─────────────────────────────────────────────────
  build-windows:
    name: Build Windows EXE Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($ver) -or $ver -eq "main") { $ver = "1.0.2" }
          $buildNum = 10 + [int]"${{ github.run_number }}"
          flutter build windows --release --build-name="$ver" --build-number="$buildNum" `
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} `
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} `
            --dart-define=BACKEND_API_URL=${{ secrets.BACKEND_API_URL }} `
            --dart-define=BACKEND_API_SECRET=${{ secrets.BACKEND_API_SECRET }} `
            --dart-define=GOOGLE_OAUTH_WEB_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}

      - name: Compile Windows .exe Installer
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($ver) -or $ver -eq "main") { $ver = "1.0.2" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" windows\installer.iss
          if (-not (Test-Path "MailFlow-Windows-Setup.exe")) { throw "MailFlow-Windows-Setup.exe not found" }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: MailFlow-Windows-Setup.exe

  # ── 3. macOS Build (.dmg) ───────────────────────────────────────────────────
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS
        run: >
          flutter build macos --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=BACKEND_API_URL=${{ secrets.BACKEND_API_URL }}
          --dart-define=BACKEND_API_SECRET=${{ secrets.BACKEND_API_SECRET }}
          --dart-define=GOOGLE_OAUTH_WEB_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}

      - name: Create DMG File
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then echo "No .app bundle found"; exit 1; fi
          hdiutil create -volname "MailFlow" -srcfolder "$APP_PATH" -ov -format UDZO "MailFlow-macOS.dmg"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: MailFlow-macOS.dmg

  # ── 4. iOS Build (.ipa) ─────────────────────────────────────────────────────
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App
        run: >
          flutter build ios --release --no-codesign
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=BACKEND_API_URL=${{ secrets.BACKEND_API_URL }}
          --dart-define=BACKEND_API_SECRET=${{ secrets.BACKEND_API_SECRET }}
          --dart-define=GOOGLE_OAUTH_WEB_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r MailFlow-iOS.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifact
          path: MailFlow-iOS.ipa

  # ── 5. Publish All to GitHub Releases ───────────────────────────────────────
  publish-release:
    name: Publish All Binaries to GitHub Release
    needs: [build-android, build-windows, build-macos, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Clean Release Notes
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -Fxv "$CURRENT_TAG" | head -n 1 || true)
          {
            echo "## What's Changed in MailFlow $CURRENT_TAG"
            echo ""
            COMMITS=""
            if [ -n "$PREV_TAG" ]; then
              COMMITS=$(git log "${PREV_TAG}..${CURRENT_TAG}" --no-merges --pretty=format:"- %s (%h)" | head -n 25 || true)
            fi
            LINE_COUNT=$(printf '%s\n' "$COMMITS" | grep -c '^-' || true)
            if [ "$LINE_COUNT" -le 2 ]; then
              COMMITS=$(git log "$CURRENT_TAG" -n 8 --no-merges --pretty=format:"- %s (%h)" || true)
            fi
            if [ -n "$COMMITS" ]; then
              echo "$COMMITS"
            else
              echo "- Maintenance release and stability improvements"
            fi
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}"
            fi
          } > release_notes.md
          cat release_notes.md

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk-artifact
          path: release-assets

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-artifact
          path: release-assets

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-artifact
          path: release-assets

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-artifact
          path: release-assets

      - name: Publish All Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MailFlow ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body_path: release_notes.md
          files: |
            release-assets/MailFlow-Android.apk
            release-assets/MailFlow-Windows-Setup.exe
            release-assets/MailFlow-macOS.dmg
            release-assets/MailFlow-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

